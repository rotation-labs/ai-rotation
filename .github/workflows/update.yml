name: Update Rotation

on:
  schedule:
    # 21:30 UTC Mon-Fri = 5:30pm New York in summer, 4:30pm in winter (after the US close)
    - cron: "30 21 * * 1-5"
    # Every 30 minutes through the US session, spanning both summer (13:30-20:00 UTC) and
    # winter (14:30-21:00 UTC) hours. :07/:37 rather than :00/:30 because GitHub delays
    # scheduled runs most at the top of the hour. Runs outside the session are harmless.
    - cron: "7,37 13-21 * * 1-5"
  workflow_dispatch: {}      # "Run workflow" button for manual refreshes
  push:
    branches: [main]         # rebuild whenever you edit baskets or the template

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write             # lets a run queue the next intraday refresh

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch prices
        run: python scripts/fetch.py
      - name: Build page
        run: python scripts/build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Serialise deploys only: the chain job below sleeps up to 30 minutes and must not hold
    # the queue, or a push to main would wait behind it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # GitHub's scheduler is best-effort and drops most of the 30-minute runs above (on
  # 2026-09-24 none fired between the open and midday). So each run made during the US
  # session queues the next one itself at the following :07/:37 slot: once any run lands in
  # the session - a scheduled one, a push, or Run workflow - refreshes keep coming until the
  # close. It runs even if this build failed, so one Yahoo hiccup doesn't end the day.
  next:
    needs: [build, deploy]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Queue the next intraday refresh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/next-refresh.sh
