name: Backtest

# Re-runs scripts/backtest.py and scripts/quadrants.py on demand, or when either changes. It
# never deploys: the reports land in the run summary and as a downloadable artifact.
on:
  workflow_dispatch: {}
  push:
    paths:
      - scripts/backtest.py
      - scripts/quadrants.py
      - .github/workflows/backtest.yml

permissions:
  contents: read

concurrency:
  group: backtest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch ten years of prices
        id: fetch
        run: python scripts/fetch.py
        env:
          FETCH_PERIOD: 10y
      - name: Run backtest
        run: python scripts/backtest.py
      # Independent of the signal backtest, so one failing doesn't hide the other's report.
      - name: Backtest quadrant shifts
        if: always() && steps.fetch.outcome == 'success'
        run: python scripts/quadrants.py
      - name: Publish summary
        if: always()
        run: |
          for f in build/backtest/quadrants.md build/backtest/report.md; do
            if test -f "$f"; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backtest
          path: build/backtest/
          if-no-files-found: warn
